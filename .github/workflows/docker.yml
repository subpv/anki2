name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Copy to the Gitea registry too, when the repository variable GITEA_USER and the
      # secret GITEA_TOKEN (Gitea token with write:package) are set. Optional GITEA_OWNER
      # pushes to an organisation instead of the user.
      - id: gitea
        if: vars.GITEA_USER != ''
        env:
          GITEA_USER: ${{ vars.GITEA_USER }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER }}
        run: echo "image=git.maidev.dk/$(echo "${GITEA_OWNER:-$GITEA_USER}" | tr '[:upper:]' '[:lower:]')/card" >> "$GITHUB_OUTPUT"
      - if: steps.gitea.outputs.image != ''
        uses: docker/login-action@v3
        with:
          registry: git.maidev.dk
          username: ${{ vars.GITEA_USER }}
          password: ${{ secrets.GITEA_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.gitea.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
