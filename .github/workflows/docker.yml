name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Copy to the Gitea registry too, when GITEA_USER (repository variable or secret) and
      # the secret GITEA_TOKEN (Gitea token with package + repository read/write) are set.
      # Optional GITEA_OWNER pushes to an organisation instead of the user.
      - id: gitea
        env:
          GITEA_USER: ${{ vars.GITEA_USER || secrets.GITEA_USER }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER || secrets.GITEA_OWNER }}
          HAS_TOKEN: ${{ secrets.GITEA_TOKEN != '' }}
        run: |
          if [ -z "$GITEA_USER" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Not copying to Gitea: GITEA_USER is ${GITEA_USER:+set}${GITEA_USER:-missing}, GITEA_TOKEN is $([ "$HAS_TOKEN" = true ] && echo set || echo missing)."
            exit 0
          fi
          echo "image=git.maidev.dk/$(echo "${GITEA_OWNER:-$GITEA_USER}" | tr '[:upper:]' '[:lower:]')/card" >> "$GITHUB_OUTPUT"
      - if: steps.gitea.outputs.image != ''
        uses: docker/login-action@v3
        with:
          registry: git.maidev.dk
          username: ${{ vars.GITEA_USER || secrets.GITEA_USER }}
          password: ${{ secrets.GITEA_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.gitea.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Copy the code to the Gitea repository (git.maidev.dk/<owner>/card) on every push to main.
  # Uses the same GITEA_USER variable and GITEA_TOKEN secret; the token also needs
  # repository: Read and Write. GitHub stays the source: Gitea's main is overwritten.
  mirror:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GITEA_USER: ${{ vars.GITEA_USER || secrets.GITEA_USER }}
          GITEA_OWNER: ${{ vars.GITEA_OWNER || secrets.GITEA_OWNER }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if [ -z "$GITEA_USER" ] || [ -z "$GITEA_TOKEN" ]; then
            echo "::notice::Not copying to Gitea: set GITEA_USER and the GITEA_TOKEN secret."
            exit 0
          fi
          owner="${GITEA_OWNER:-$GITEA_USER}"
          git push --force "https://${GITEA_USER}:${GITEA_TOKEN}@git.maidev.dk/${owner}/card.git" HEAD:refs/heads/main
          git push --force --tags "https://${GITEA_USER}:${GITEA_TOKEN}@git.maidev.dk/${owner}/card.git"
